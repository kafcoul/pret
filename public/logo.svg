  <!-- Texte principal -->
  <text x="64" y="22" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="20" fill="#0F2B4C" letter-spacing="0.5">Solutions Financement</text>
  <text x="64" y="44" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="22" fill="#C8963E" letter-spacing="1.5">FORTIER</text>
