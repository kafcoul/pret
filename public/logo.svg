    <line x1="28" y1="28" x2="34" y2="28" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="32" y1="28" x2="32" y2="31" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="34" y1="28" x2="34" y2="30" stroke="#FFFFFF" stroke-width="1.2"/>
